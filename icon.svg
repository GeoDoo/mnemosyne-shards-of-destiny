<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="shard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="50%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#feca57"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>
  
  <!-- Moon (Red Moon) -->
  <circle cx="96" cy="32" r="16" fill="#c0392b" opacity="0.8"/>
  <circle cx="100" cy="28" r="12" fill="#e74c3c" opacity="0.6"/>
  
  <!-- Central Shard (Memory Shard) -->
  <polygon points="64,20 80,64 64,108 48,64" fill="url(#shard)" opacity="0.9"/>
  
  <!-- Shard glow -->
  <polygon points="64,25 75,64 64,103 53,64" fill="#fff" opacity="0.3"/>
  
  <!-- Small floating shards -->
  <polygon points="30,50 38,65 30,80 22,65" fill="#e94560" opacity="0.6"/>
  <polygon points="98,55 104,68 98,81 92,68" fill="#feca57" opacity="0.6"/>
  
  <!-- Temple pillar silhouettes -->
  <rect x="20" y="85" width="8" height="30" fill="#2c3e50" opacity="0.5"/>
  <rect x="35" y="90" width="6" height="25" fill="#2c3e50" opacity="0.4"/>
  <rect x="87" y="88" width="7" height="27" fill="#2c3e50" opacity="0.5"/>
  <rect x="100" y="92" width="8" height="23" fill="#2c3e50" opacity="0.4"/>
</svg>
